<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 추출 — just-this</title>
  <style>
    :root{--bg:#eaf0f7;--surface:#fff;--surface2:#f4f7fb;--border:#d6e0ec;--fg:#16263d;--dim:#5e7088;--primary:#0f63ad;--primary-d:#0a4d89;--accent:#37a3df;--ok:#1a9e5f;--warn:#c2410c;--shadow:0 1px 3px rgba(20,50,90,.08),0 6px 20px rgba(20,50,90,.06);--r:12px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55}
    button,select,input{font-family:inherit}
    a{color:var(--primary);text-decoration:none}
    .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1.2rem;padding:0 1.4rem;height:58px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(20,50,90,.05)}
    .nav-brand{font-weight:800;font-size:1.3rem;color:var(--primary);text-decoration:none}
    .nav-links{display:flex;gap:.25rem;flex-wrap:wrap}
    .nav-links a{color:var(--fg);text-decoration:none;padding:.42rem .8rem;border-radius:9px;font-size:.96rem}
    .nav-links a:hover{background:var(--surface2);color:var(--primary)}
    .nav-links a.cur{background:var(--primary);color:#fff}
    .pagehead{max-width:54rem;margin:0 auto;padding:1.2rem 1rem .2rem;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
    .pagehead h1{margin:0;font-size:1.4rem;color:var(--primary-d)}
    .pagehead .sub{color:var(--dim);font-size:.88rem}
    .wrap{max-width:54rem;margin:0 auto;padding:1rem 1rem 5rem}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin-bottom:1.1rem}
    .panel h2{margin:.1rem 0 .9rem;font-size:1.02rem}
    .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.55rem 0}
    .row>label.k{min-width:5rem;color:var(--dim);font-size:.9rem}
    input[type=text],input[type=url],input[type=number],select{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;font-size:.95rem}
    input[type=number]{width:6rem}
    #url,#purl{flex:1;min-width:16rem}
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .seg button{background:var(--surface);color:var(--fg);border:0;border-left:1px solid var(--border);padding:.45rem .9rem;cursor:pointer;font-size:.92rem}
    .seg button:first-child{border-left:0}
    .seg button.sel{background:var(--primary);color:#fff}
    .tabs{display:flex;gap:.4rem;max-width:54rem;margin:.9rem auto 0;padding:0 1rem}
    .tabs button{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:.55rem 1.1rem;cursor:pointer;font-size:.95rem;font-weight:600}
    .tabs button.sel{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:.55rem 1rem;font-size:.95rem;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--primary-d)} .btn:disabled{opacity:.5;cursor:default}
    .btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--border)}
    .btn.ghost:hover{background:var(--surface2)}
    .btn.sm{padding:.35rem .7rem;font-size:.85rem;font-weight:600}
    .go{display:block;width:100%;padding:.9rem;font-size:1.05rem}
    .toggle{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}
    .muted{color:var(--dim);font-size:.85rem}
    .hide{display:none}
    .vinfo{display:flex;gap:1rem;align-items:flex-start}
    .vinfo img{width:160px;border-radius:8px;border:1px solid var(--border)}
    .vinfo .t{font-weight:700;font-size:1.05rem}
    .status{margin-top:.8rem;font-size:.92rem;min-height:1.2em}
    .status.err{color:var(--warn)} .status.ok{color:var(--ok)} .status.work{color:var(--primary)}
    .note{font-size:.82rem;color:var(--dim);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;margin-top:.4rem}
    /* 재생목록 */
    .plhead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
    .plhead .t{font-weight:700;font-size:1.05rem}
    .tracks{max-height:24rem;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}
    .tr{display:grid;grid-template-columns:1.6rem 2.2rem 1fr auto;gap:.5rem;align-items:center;padding:.4rem .7rem;border-top:1px solid var(--border);font-size:.92rem;cursor:pointer}
    .tr:first-child{border-top:0}
    .tr:hover{background:#eef3f9}
    .tr .n{color:var(--dim);font-variant-numeric:tabular-nums}
    .tr .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tr .tt small{color:var(--dim);margin-left:.4rem}
    .tr .d{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
    .tr.done{opacity:.55}
    .prog{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-top:.6rem}
    .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}
    .cur{font-size:.88rem;color:var(--dim);margin-top:.35rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fails{margin-top:.6rem;font-size:.85rem;color:var(--warn)}
    .fails li{margin:.15rem 0}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="../">just-this</a>
    <div class="nav-links" id="nav"></div>
  </nav>
  <div class="pagehead">
    <h1>유튜브 추출</h1>
    <span class="sub">화질 선택 · 오디오(mp3) · 구간 자르기 · 자막 · 재생목록 일괄 MP3</span>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="single" class="sel">단일 영상</button>
    <button data-t="playlist">재생목록 → MP3</button>
  </div>

  <!-- ═══════════ 단일 영상 ═══════════ -->
  <div class="wrap" id="tab-single">
    <section class="panel">
      <h2>1. 링크</h2>
      <div class="row">
        <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button class="btn" id="infoBtn">정보 가져오기</button>
      </div>
      <div class="note">서버(이 PC)가 직접 받아서 내려줍니다. 인터넷 연결 필요. 개인 보관용으로 사용하세요.</div>
      <div class="status" id="status0"></div>
    </section>

    <section class="panel hide" id="opt">
      <div class="vinfo">
        <img id="thumb" alt="" class="hide">
        <div>
          <div class="t" id="title">—</div>
          <div class="muted" id="byline"></div>
        </div>
      </div>
      <hr style="border:0;border-top:1px solid var(--border);margin:1rem 0">
      <div class="row">
        <label class="k">받기</label>
        <span class="seg" id="mode">
          <button data-m="video" class="sel">영상 (MP4)</button>
          <button data-m="audio">오디오 (MP3)</button>
        </span>
      </div>
      <div class="row" id="rowQ">
        <label class="k">화질</label>
        <select id="height"><option value="0">최고 화질</option></select>
      </div>
      <div class="row">
        <span class="toggle"><input type="checkbox" id="useTrim"> <label for="useTrim" style="cursor:pointer">구간 자르기</label></span>
        <span id="trimBox" class="hide">
          <input type="number" id="start" min="0" step="1" value="0" placeholder="시작(초)"> ~
          <input type="number" id="end" min="0" step="1" value="0" placeholder="끝(초)"> <span class="muted">초</span>
        </span>
      </div>
      <div class="row" id="rowSubs">
        <span class="toggle"><input type="checkbox" id="subs"> <label for="subs" style="cursor:pointer">자막 포함(있으면)</label></span>
      </div>
      <button class="btn go" id="dlBtn">다운로드</button>
      <div class="status" id="status"></div>
    </section>
  </div>

  <!-- ═══════════ 재생목록 → MP3 ═══════════ -->
  <div class="wrap hide" id="tab-playlist">
    <section class="panel">
      <h2>1. 재생목록 링크</h2>
      <div class="row">
        <input type="url" id="purl" placeholder="https://www.youtube.com/playlist?list=..." autocomplete="off">
        <button class="btn" id="pinfoBtn">목록 가져오기</button>
      </div>
      <div class="note">재생목록 주소(<code>playlist?list=…</code>)나 <code>watch?v=…&amp;list=…</code> 형태 모두 됩니다. 비공개 목록은 안 됨. 최대 300곡.</div>
      <div class="status" id="pstatus0"></div>
    </section>

    <section class="panel hide" id="plist">
      <div class="plhead">
        <div>
          <div class="t" id="ptitle">—</div>
          <div class="muted" id="pmeta"></div>
        </div>
        <div style="display:flex;gap:.4rem">
          <button class="btn ghost sm" id="selAll">전체 선택</button>
          <button class="btn ghost sm" id="selNone">전체 해제</button>
        </div>
      </div>
      <div class="tracks" id="tracks"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:1rem 0">
      <div class="row">
        <label class="k">음질</label>
        <span class="seg" id="pq">
          <button data-q="320" class="sel">320k (고음질)</button>
          <button data-q="192">192k</button>
          <button data-q="128">128k</button>
        </span>
      </div>
      <div class="row">
        <span class="toggle"><input type="checkbox" id="pnum" checked> <label for="pnum" style="cursor:pointer">파일명 앞에 순번 (01 - 제목.mp3)</label></span>
      </div>
      <div class="row">
        <span class="toggle"><input type="checkbox" id="ptags" checked> <label for="ptags" style="cursor:pointer">제목·아티스트·앨범아트 태그 심기</label></span>
      </div>
      <button class="btn go" id="pgoBtn">선택한 곡 MP3로 받기</button>
      <div class="status" id="pstatus"></div>
    </section>

    <section class="panel hide" id="pjob">
      <h2>진행 상황</h2>
      <div class="row" style="justify-content:space-between">
        <span id="pcount" style="font-weight:700">0 / 0</span>
        <button class="btn ghost sm" id="pcancel">취소</button>
      </div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="cur" id="pcur"></div>
      <ul class="fails hide" id="pfails"></ul>
      <button class="btn go hide" id="presult" style="margin-top:.9rem">결과 받기</button>
      <div class="status" id="pjstatus"></div>
    </section>
  </div>

  <script>
  const $=s=>document.querySelector(s);
  fetch('/api/tools').then(r=>r.json()).then(d=>{const n=$('#nav');(d.tools||[]).forEach(t=>{if(!t._open)return;const a=document.createElement('a');a.href=t._open;a.textContent=t.short||t.name;if(t.slug==='ytdl')a.className='cur';n.appendChild(a);});}).catch(()=>{});

  function fmtDur(s){s=Math.round(s||0);const h=(s/3600|0),m=(s%3600/60|0),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0');}
  function setSt(id,t,c){const s=$(id);s.textContent=t;s.className='status'+(c?' '+c:'')}
  async function saveResponse(res,fallback){
    const blob=await res.blob();
    const cd=res.headers.get('Content-Disposition')||'';
    let name=(cd.match(/filename\*=UTF-8''([^;]+)/)||[])[1];
    name=name?decodeURIComponent(name):((cd.match(/filename="?([^"]+)"?/)||[])[1]||fallback);
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
    return {name,size:blob.size};
  }

  // ── 탭 ──
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    [...$('#tabs').children].forEach(x=>x.classList.toggle('sel',x===b));
    $('#tab-single').classList.toggle('hide',b.dataset.t!=='single');
    $('#tab-playlist').classList.toggle('hide',b.dataset.t!=='playlist');
    try{localStorage.setItem('ytdl.tab',b.dataset.t)}catch(_){}
  });
  try{const t=localStorage.getItem('ytdl.tab');if(t==='playlist')$('#tabs button[data-t=playlist]').click();}catch(_){}
  // 재생목록 링크를 단일 탭에 붙여넣으면 안내
  $('#url').addEventListener('input',e=>{const v=e.target.value;if(/[?&]list=/.test(v)&&!/[?&]v=/.test(v))setSt('#status0','재생목록 링크네요 — 위 "재생목록 → MP3" 탭에서 한 번에 받을 수 있어요','work');});

  // ═══════════ 단일 영상 ═══════════
  let mode='video';
  const st0=(t,c)=>setSt('#status0',t,c), st=(t,c)=>setSt('#status',t,c);

  function renderInfo(d){
    $('#title').textContent=d.title||'(제목 없음)';
    $('#byline').textContent=[d.uploader,d.duration?fmtDur(d.duration):''].filter(Boolean).join(' · ');
    if(d.thumbnail){$('#thumb').src=d.thumbnail;$('#thumb').classList.remove('hide');}
    const sel=$('#height');sel.innerHTML='<option value="0">최고 화질</option>';
    (d.heights||[]).forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h+'p';sel.appendChild(o);});
    $('#opt').classList.remove('hide');
    if(d.duration){$('#end').value=Math.round(d.duration);}
  }

  $('#infoBtn').addEventListener('click',async()=>{
    const url=$('#url').value.trim(); if(!url){st0('URL을 넣어주세요','err');return;}
    st0('가져오는 중…','work'); $('#infoBtn').disabled=true;
    try{
      const fd=new FormData();fd.append('url',url);
      const res=await fetch('api/info',{method:'POST',body:fd});
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      renderInfo(await res.json()); st0('정보 불러옴','ok');
    }catch(err){st0('실패: '+err.message,'err')}
    $('#infoBtn').disabled=false;
  });

  $('#mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$('#mode').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mode=b.dataset.m;
    $('#rowQ').classList.toggle('hide',mode!=='video');$('#rowSubs').classList.toggle('hide',mode!=='video');});
  $('#useTrim').addEventListener('change',e=>$('#trimBox').classList.toggle('hide',!e.target.checked));

  $('#dlBtn').addEventListener('click',async()=>{
    const url=$('#url').value.trim(); if(!url){st('URL 없음','err');return;}
    st('받는 중… 영상 길이에 따라 오래 걸릴 수 있어요','work'); $('#dlBtn').disabled=true;
    const fd=new FormData();
    fd.append('url',url);fd.append('mode',mode);fd.append('height',$('#height').value||0);
    fd.append('subs',$('#subs').checked);
    if($('#useTrim').checked){fd.append('start',$('#start').value||0);fd.append('end',$('#end').value||0);}
    try{
      const res=await fetch('api/download',{method:'POST',body:fd});
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      const r=await saveResponse(res,'download');
      st('완료 — '+r.name+' ('+Math.round(r.size/1048576)+'MB)','ok');
    }catch(err){st('실패: '+err.message,'err')}
    $('#dlBtn').disabled=false;
  });

  // ═══════════ 재생목록 → MP3 ═══════════
  let plItems=[], plTitle='', plQuality=320, job=null, pollTimer=null;
  const pst0=(t,c)=>setSt('#pstatus0',t,c), pst=(t,c)=>setSt('#pstatus',t,c), pjst=(t,c)=>setSt('#pjstatus',t,c);

  function renderPlaylist(d){
    plItems=d.items||[]; plTitle=d.title||'';
    $('#ptitle').textContent=plTitle||'(단일 영상)';
    $('#pmeta').textContent=d.count+'곡 · 총 '+fmtDur(d.total_duration)+(d.truncated?' · 300곡까지만 표시':'');
    const box=$('#tracks'); box.innerHTML='';
    plItems.forEach(it=>{
      const row=document.createElement('label'); row.className='tr'; row.dataset.n=it.n;
      row.innerHTML='<input type="checkbox" checked><span class="n">'+String(it.n).padStart(2,'0')+'</span>'
        +'<span class="tt"></span><span class="d">'+(it.duration?fmtDur(it.duration):'')+'</span>';
      const tt=row.querySelector('.tt'); tt.textContent=it.title;
      if(it.uploader){const s=document.createElement('small');s.textContent=it.uploader;tt.appendChild(s);}
      box.appendChild(row);
    });
    $('#plist').classList.remove('hide'); $('#pjob').classList.add('hide');
    updateGo();
  }
  function selected(){return [...$('#tracks').querySelectorAll('.tr')].filter(r=>r.querySelector('input').checked).map(r=>+r.dataset.n);}
  function updateGo(){const n=selected().length;$('#pgoBtn').textContent=n?('선택한 '+n+'곡 MP3로 받기'):'곡을 선택하세요';$('#pgoBtn').disabled=!n;}
  $('#tracks').addEventListener('change',updateGo);
  $('#selAll').addEventListener('click',()=>{$('#tracks').querySelectorAll('input').forEach(c=>c.checked=true);updateGo();});
  $('#selNone').addEventListener('click',()=>{$('#tracks').querySelectorAll('input').forEach(c=>c.checked=false);updateGo();});
  $('#pq').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$('#pq').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');plQuality=+b.dataset.q;});

  $('#pinfoBtn').addEventListener('click',async()=>{
    const url=$('#purl').value.trim(); if(!url){pst0('URL을 넣어주세요','err');return;}
    pst0('목록 읽는 중… (곡 수가 많으면 잠깐 걸려요)','work'); $('#pinfoBtn').disabled=true;
    try{
      const fd=new FormData();fd.append('url',url);
      const res=await fetch('api/playlist/info',{method:'POST',body:fd});
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      renderPlaylist(await res.json()); pst0('목록 불러옴','ok');
    }catch(err){pst0('실패: '+err.message,'err')}
    $('#pinfoBtn').disabled=false;
  });

  $('#pgoBtn').addEventListener('click',async()=>{
    const url=$('#purl').value.trim(); const sel=selected(); if(!url||!sel.length)return;
    pst('작업 시작 중…','work'); $('#pgoBtn').disabled=true;
    const fd=new FormData();
    fd.append('url',url); fd.append('quality',plQuality); fd.append('label',plTitle);
    fd.append('numbering',$('#pnum').checked); fd.append('tags',$('#ptags').checked);
    if(sel.length!==plItems.length)fd.append('indexes',sel.join(','));
    try{
      const res=await fetch('api/playlist/start',{method:'POST',body:fd});
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      job=await res.json(); pst('','');
      showJob(job); poll();
    }catch(err){pst('실패: '+err.message,'err');$('#pgoBtn').disabled=false;}
  });

  function showJob(j){
    $('#pjob').classList.remove('hide'); $('#presult').classList.add('hide'); $('#pfails').classList.add('hide');
    $('#pcancel').disabled=false; pjst('','');
    renderJob(j); $('#pjob').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function renderJob(j){
    const total=j.total||selected().length||0;
    const pct=total?((j.done+ (j.pct||0)/100)/total*100):0;
    $('#pbar').style.width=Math.min(100,pct).toFixed(1)+'%';
    $('#pcount').textContent=j.done+' / '+total+(j.failed&&j.failed.length?' (실패 '+j.failed.length+')':'');
    $('#pcur').textContent=j.state==='running'?(j.current?('받는 중: '+j.current+(j.pct?' '+j.pct+'%':'')):'준비 중…'):'';
    // 완료된 곡은 목록에서 흐리게
    const rows=$('#tracks').querySelectorAll('.tr'); let k=0;
    selected().forEach(n=>{const r=$('#tracks .tr[data-n="'+n+'"]');if(r)r.classList.toggle('done',k++<j.done);});
    if(j.failed&&j.failed.length){const ul=$('#pfails');ul.innerHTML='';j.failed.forEach(f=>{const li=document.createElement('li');li.textContent='실패: '+f.title+' — '+f.reason;ul.appendChild(li);});ul.classList.remove('hide');}
    if(j.state==='done'){
      $('#pbar').style.width='100%'; $('#pcancel').disabled=true;
      $('#presult').classList.remove('hide'); $('#presult').textContent='결과 받기 — '+j.filename;
      pjst('완료! '+(j.failed.length?j.failed.length+'곡은 실패했어요. ':'')+'아래 버튼으로 받으세요 (30분 후 자동 삭제)','ok');
      $('#pgoBtn').disabled=false;
    }else if(j.state==='error'){pjst('실패: '+j.error,'err');$('#pcancel').disabled=true;$('#pgoBtn').disabled=false;}
    else if(j.state==='canceled'){pjst('취소됨','err');$('#pcancel').disabled=true;$('#pgoBtn').disabled=false;}
  }
  async function poll(){
    clearTimeout(pollTimer); if(!job)return;
    try{
      const res=await fetch('api/playlist/status/'+job.id);
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      job=await res.json(); renderJob(job);
      if(job.state==='running')pollTimer=setTimeout(poll,1500);
    }catch(err){pjst('상태 확인 실패: '+err.message,'err');$('#pgoBtn').disabled=false;}
  }
  $('#pcancel').addEventListener('click',async()=>{
    if(!job)return; $('#pcancel').disabled=true; pjst('취소 중…','work');
    try{await fetch('api/playlist/cancel/'+job.id,{method:'POST'});}catch(_){}
  });
  $('#presult').addEventListener('click',async()=>{
    if(!job)return; $('#presult').disabled=true; pjst('내려받는 중…','work');
    try{
      const res=await fetch('api/playlist/result/'+job.id);
      if(!res.ok)throw new Error((await res.json()).detail||res.status);
      const r=await saveResponse(res,job.filename||'playlist.zip');
      pjst('저장됨 — '+r.name+' ('+Math.round(r.size/1048576)+'MB)','ok');
    }catch(err){pjst('실패: '+err.message,'err')}
    $('#presult').disabled=false;
  });
  </script>
</body>
</html>
