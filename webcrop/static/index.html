<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF·문서 자르기·회전·변환 — just-this</title>
  <link rel="stylesheet" href="static/cropper.min.css">
  <style>
    :root{
      --bg:#eaf0f7;--surface:#fff;--surface2:#f4f7fb;--border:#d6e0ec;
      --fg:#16263d;--dim:#5e7088;--primary:#0f63ad;--primary-d:#0a4d89;
      --accent:#37a3df;--ok:#1a9e5f;--warn:#c2410c;
      --shadow:0 1px 3px rgba(20,50,90,.08),0 6px 20px rgba(20,50,90,.06);--r:12px;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55}
    button,select,input{font-family:inherit}
    a{color:var(--primary);text-decoration:none}
    .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1.2rem;padding:0 1.4rem;height:58px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(20,50,90,.05)}
    .nav-brand{font-weight:800;font-size:1.3rem;color:var(--primary);text-decoration:none}
    .nav-links{display:flex;gap:.25rem;flex-wrap:wrap}
    .nav-links a{color:var(--fg);text-decoration:none;padding:.42rem .8rem;border-radius:9px;font-size:.96rem}
    .nav-links a:hover{background:var(--surface2);color:var(--primary)}
    .nav-links a.cur{background:var(--primary);color:#fff}
    .pagehead{max-width:64rem;margin:0 auto;padding:1.2rem 1rem .2rem;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
    .pagehead h1{margin:0;font-size:1.4rem;color:var(--primary-d)}
    .pagehead .sub{color:var(--dim);font-size:.88rem}
    .wrap{max-width:64rem;margin:0 auto;padding:1rem 1rem 6rem}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin-bottom:1.1rem}
    .panel h2{margin:.1rem 0 .9rem;font-size:1.02rem}
    .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.55rem 0}
    .row>label.k{min-width:6rem;color:var(--dim);font-size:.9rem}
    .drop{border:2px dashed var(--border);border-radius:var(--r);padding:1.6rem 1rem;text-align:center;color:var(--dim);cursor:pointer;background:var(--surface2)}
    .drop:hover,.drop.over{border-color:var(--primary);color:var(--fg)}
    .drop input{display:none}
    .file-name{color:var(--fg);font-weight:600}
    select,input[type=number],input[type=text]{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:.4rem .6rem;font-size:.9rem}
    input[type=range]{accent-color:var(--primary)}
    input[type=number].rot{width:5.5rem;text-align:right}
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .seg button{background:var(--surface);color:var(--fg);border:0;border-left:1px solid var(--border);padding:.4rem .75rem;cursor:pointer;font-size:.9rem}
    .seg button:first-child{border-left:0}
    .seg button.sel{background:var(--primary);color:#fff}
    .btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:.6rem 1rem;font-size:.95rem;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--primary-d)} .btn:disabled{opacity:.5;cursor:default}
    .btn.mini{background:var(--surface);color:var(--primary);border:1px solid var(--border);padding:.35rem .6rem;font-size:.85rem;border-radius:8px}
    .go{display:block;width:100%;padding:.9rem;font-size:1.05rem}
    .toggle{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}
    .muted{color:var(--dim);font-size:.85rem}
    .pages{display:flex;flex-direction:column;gap:1rem}
    .page{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
    .page .ptitle{padding:.5rem .8rem;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--dim);background:var(--surface2)}
    .page .imgbox{padding:.6rem;max-height:74vh}
    .page img{display:block;max-width:100%}
    .status{margin-top:.8rem;font-size:.92rem;min-height:1.2em}
    .status.err{color:var(--warn)} .status.ok{color:var(--ok)}
    .hide{display:none}
    .controls{position:sticky;top:58px;z-index:10;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--r);padding:.9rem 1.1rem;margin-bottom:1.1rem}
    .toolbar{position:sticky;bottom:0;z-index:10;background:var(--surface);border:1px solid var(--border);box-shadow:0 -2px 16px rgba(20,50,90,.1);border-radius:var(--r);padding:1rem 1.1rem;margin-top:1.1rem}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="../">just-this</a>
    <div class="nav-links" id="nav"></div>
  </nav>
  <div class="pagehead">
    <h1>PDF·문서 자르기·회전·변환</h1>
    <span class="sub">회전 · 자르기(테두리 스냅) · A4/Letter/명함 실치수 맞춤 · PDF/PNG/JPG</span>
  </div>

  <div class="wrap">
    <!-- 1. 불러오기 -->
    <section class="panel">
      <h2>1. 불러오기</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp">
        <div id="dropLabel"><strong>PDF·이미지를 끌어다 놓거나 클릭</strong></div>
        <div class="muted">PDF · PNG · JPG · TIFF · 최대 50MB</div>
      </label>
      <div class="row">
        <span class="toggle"><input type="checkbox" id="deskew"> <label for="deskew" style="cursor:pointer">자동 기울기 보정(deskew)</label></span>
        <button class="btn" id="loadBtn" disabled>불러오기</button>
      </div>
    </section>

    <!-- 2. 편집: 회전(실시간) + 스냅 -->
    <section class="controls hide" id="controls">
      <div class="row">
        <label class="k">회전</label>
        <input type="range" id="rotRange" min="-180" max="180" step="0.5" value="0" style="flex:1;min-width:12rem;max-width:30rem">
        <input type="number" id="rotNum" class="rot" min="-180" max="180" step="0.5" value="0"><span class="muted">°</span>
        <button class="btn mini" data-rot="-90">↺ 90°</button>
        <button class="btn mini" data-rot="90">↻ 90°</button>
        <button class="btn mini" data-rot="0">0°</button>
      </div>
      <div class="row">
        <span class="toggle"><input type="checkbox" id="snap"> <label for="snap" style="cursor:pointer">테두리 스냅 — 내용 경계에 딱 맞춤</label></span>
        <span class="muted">끄면 자유롭게 드래그</span>
      </div>
    </section>

    <section class="hide" id="pagesSec">
      <div class="pages" id="pages"></div>
    </section>

    <!-- 3. 변환 -->
    <section class="toolbar hide" id="toolbar">
      <div class="row">
        <label class="k">용지 규격</label>
        <select id="paper">
          <option value="">없음 (자른 그대로 · 원본 실치수)</option>
          <option value="a4">A4 (210×297mm)</option><option value="a3">A3</option><option value="a5">A5</option>
          <option value="letter">Letter</option><option value="legal">Legal</option><option value="tabloid">Tabloid</option>
          <option value="card">명함 (90×50)</option><option value="card_us">명함 US (89×51)</option>
        </select>
        <span class="seg" id="paperMode">
          <button data-m="crop" class="sel">비율 맞춰 잘라냄</button>
          <button data-m="fit">흰 여백에 맞춤</button>
        </span>
        <span class="toggle"><input type="checkbox" id="landscape"> <label for="landscape" style="cursor:pointer">가로</label></span>
      </div>
      <div class="row">
        <label class="k">출력 형식</label>
        <span class="seg" id="fmt">
          <button data-f="pdf" class="sel">PDF</button>
          <button data-f="png">PNG</button>
          <button data-f="jpg">JPG</button>
        </span>
        <label class="k" style="min-width:auto">화질</label>
        <select id="quality2">
          <option value="lossless">원본 (무손실)</option>
          <option value="95">고품질 (JPEG 95)</option>
          <option value="80">표준 (JPEG 80)</option>
        </select>
      </div>
      <button class="btn go" id="convertBtn">변환 · 다운로드</button>
      <div class="status" id="status"></div>
    </section>
  </div>

  <script src="static/cropper.min.js"></script>
  <script>
  const $=s=>document.querySelector(s);
  fetch('/api/tools').then(r=>r.json()).then(d=>{const n=document.getElementById('nav');(d.tools||[]).forEach(t=>{if(!t._open)return;const a=document.createElement('a');a.href=t._open;a.textContent=t.short||t.name;if(t.slug==='webcrop')a.className='cur';n.appendChild(a);});}).catch(()=>{});

  let selectedFile=null, pages=[];   // pages: [{idx, cropper, snap:[x,y,w,h]}]

  // 파일 선택
  const drop=$('#drop'), fileInput=$('#file'), loadBtn=$('#loadBtn');
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])});
  fileInput.addEventListener('change',()=>{if(fileInput.files[0])pick(fileInput.files[0])});
  function pick(f){selectedFile=f;$('#dropLabel').innerHTML='<span class="file-name">'+f.name+'</span> — 다시 고르려면 클릭';loadBtn.disabled=false;}

  // 불러오기
  loadBtn.addEventListener('click',async()=>{
    if(!selectedFile)return;
    status('불러오는 중…');loadBtn.disabled=true;
    const fd=new FormData();fd.append('file',selectedFile);fd.append('auto_deskew',$('#deskew').checked);
    try{
      const res=await fetch('api/upload',{method:'POST',body:fd});
      if(!res.ok)throw new Error(await res.text());
      const data=await res.json();
      build(data.pages);
      $('#controls').classList.remove('hide');$('#pagesSec').classList.remove('hide');$('#toolbar').classList.remove('hide');
      status('불러옴 — '+data.pages.length+'페이지. 회전/자르고 변환하세요.','ok');
      // 현재 회전값 반영
      applyRot(+$('#rotNum').value);
    }catch(err){status('실패: '+err.message,'err')}
    loadBtn.disabled=false;
  });

  function build(list){
    pages.forEach(p=>p.cropper&&p.cropper.destroy());
    pages=[];const box=$('#pages');box.innerHTML='';
    list.forEach(pg=>{
      const card=document.createElement('div');card.className='page';
      card.innerHTML='<div class="ptitle">페이지 '+(pg.idx+1)+' · '+pg.w+'×'+pg.h+'px</div><div class="imgbox"><img></div>';
      const img=card.querySelector('img');box.appendChild(card);
      const rec={idx:pg.idx,cropper:null,snap:pg.snap};
      img.onload=()=>{rec.cropper=new Cropper(img,{viewMode:0,autoCropArea:1,checkOrientation:false,background:false,guides:true,rotatable:true,zoomable:false});};
      img.src=pg.url+'?t='+Date.now();
      pages.push(rec);
    });
  }

  // 회전 (실시간)
  const rotRange=$('#rotRange'), rotNum=$('#rotNum');
  function applyRot(v){pages.forEach(p=>p.cropper&&p.cropper.rotateTo(v));}
  rotRange.addEventListener('input',e=>{rotNum.value=e.target.value;applyRot(+e.target.value);});
  rotNum.addEventListener('input',e=>{let v=Math.max(-180,Math.min(180,+e.target.value||0));rotRange.value=v;applyRot(v);});
  document.querySelectorAll('[data-rot]').forEach(b=>b.addEventListener('click',()=>{
    let v=+b.dataset.rot;
    if(b.dataset.rot==='90'||b.dataset.rot==='-90'){v=((+rotNum.value)+(+b.dataset.rot));} // 누적 ±90
    v=Math.max(-180,Math.min(180,v));rotNum.value=v;rotRange.value=v;applyRot(v);
  }));

  // 테두리 스냅
  $('#snap').addEventListener('change',e=>{
    pages.forEach(p=>{
      if(!p.cropper)return;
      if(e.target.checked && p.snap){const[x,y,w,h]=p.snap;p.cropper.setData({x,y,width:w,height:h});}
      else{const d=p.cropper.getImageData();p.cropper.setData({x:0,y:0,width:d.naturalWidth,height:d.naturalHeight});}
    });
  });

  // 출력 옵션
  let paperMode='crop',fmt='pdf';
  $('#paperMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$('#paperMode').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');paperMode=b.dataset.m;});
  $('#fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$('#fmt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fmt=b.dataset.f;});

  // 변환: 브라우저에서 회전+크롭 결과를 그대로 만들어 보냄 (WYSIWYG)
  const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
  $('#convertBtn').addEventListener('click',async()=>{
    if(!pages.length){status('먼저 불러오기','err');return;}
    status('변환 중…');$('#convertBtn').disabled=true;
    try{
      const fd=new FormData();let n=0;
      for(const p of pages){
        if(!p.cropper)continue;
        const c=p.cropper.getCroppedCanvas({fillColor:'#ffffff',imageSmoothingEnabled:true,imageSmoothingQuality:'high'});
        if(!c)continue;
        fd.append('files',await toBlob(c),`page_${++n}.png`);
      }
      if(!n)throw new Error('자른 영역이 없음');
      fd.append('fmt',fmt);fd.append('paper',$('#paper').value);fd.append('paper_mode',paperMode);
      fd.append('landscape',$('#landscape').checked);
      const qv=$('#quality2').value,lossless=qv==='lossless';
      fd.append('lossless',lossless);fd.append('quality',lossless?100:qv);
      const res=await fetch('api/assemble',{method:'POST',body:fd});
      if(!res.ok)throw new Error(await res.text());
      const blob=await res.blob();
      const cd=res.headers.get('Content-Disposition')||'';
      const name=(cd.match(/filename="?([^"]+)"?/)||[])[1]||('webcrop.'+fmt);
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
      status('완료 — '+name+' 다운로드','ok');
    }catch(err){status('실패: '+err.message,'err')}
    $('#convertBtn').disabled=false;
  });

  function status(t,cls){const s=$('#status');s.textContent=t;s.className='status'+(cls?' '+cls:'');}
  </script>
</body>
</html>
